<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Campus – AI Student Assistance</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1fb;--panel:rgba(255,255,255,.78);--text:#151a33;--muted:#5d6486;--line:rgba(80,90,160,.18);--a:#5b5bf0;--b:#0ea5c6;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0d1f;--panel:rgba(22,27,58,.72);--text:#e8ebff;--muted:#98a0cf;--line:rgba(140,150,255,.18);--a:#7c7cff;--b:#22d3ee}}
:root[data-theme="dark"]{--bg:#0a0d1f;--panel:rgba(22,27,58,.72);--text:#e8ebff;--muted:#98a0cf;--line:rgba(140,150,255,.18);--a:#7c7cff;--b:#22d3ee}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;z-index:0}
button{font:inherit;color:inherit;cursor:pointer}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(20,20,80,.12)}
.btn{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border:0;padding:10px 18px;border-radius:12px;font-weight:600;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(90,90,240,.4)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
input{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;outline:0}
input:focus{border-color:var(--a)}
#login{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:16px}
.lg{width:min(400px,100%);padding:32px;animation:rise .8s both}
.lg h1{margin:8px 0 4px;font-size:26px}
.lg p{color:var(--muted);margin:0 0 18px}
.lg input{margin-bottom:12px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;color:#fff;font-size:22px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(6deg)}}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.96)}}
@keyframes pulse{50%{opacity:.35}}
#app{position:relative;z-index:2;height:100%;display:none}
#app.on{display:flex}
nav{width:230px;padding:16px;margin:12px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
nav .brand{display:flex;gap:10px;align-items:center;font-weight:700;padding:6px 8px 16px}
nav .brand .logo{width:36px;height:36px;font-size:18px}
.nv{background:none;border:0;text-align:left;padding:11px 14px;border-radius:12px;color:var(--muted);display:flex;gap:10px;transition:.2s}
.nv:hover{background:var(--line);color:var(--text)}
.nv.act{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;box-shadow:0 6px 16px rgba(90,90,240,.35)}
.spacer{flex:1}
main{flex:1;overflow:auto;padding:12px 16px 24px 4px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 16px;flex-wrap:wrap}
.top h2{margin:0;font-size:24px}
.top small{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.4s infinite}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:14px}
.card{padding:18px;animation:rise .6s both}
.card h3{margin:0 0 10px;font-size:15px}
.stat .v{font-size:32px;font-weight:700;background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{color:var(--muted);font-size:13px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--a),var(--b));transition:width 1s}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row small{color:var(--muted)}
.tag{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--line)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:380px;overflow:hidden}
#msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:10px 14px;border-radius:16px;animation:rise .3s both;white-space:pre-line}
.m.u{align-self:flex-end;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--line);border-bottom-left-radius:4px}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:pulse .9s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
.sug{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 10px}
.sug button{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--muted)}
.sug button:hover{border-color:var(--a);color:var(--text)}
.cin{display:flex;gap:8px;padding:12px 18px 18px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.slot{padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:none;text-align:center;font-size:13px;transition:.2s}
.slot:hover{border-color:var(--a);transform:translateY(-2px)}
.slot.bk{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border:0}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;flex-direction:column;gap:8px}
.t{padding:12px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);animation:rise .4s both}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
td,th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:13px}
@keyframes grow{from{height:0}}nav{overflow-y:auto}
@media(max-width:820px){#app.on{flex-direction:column}nav{width:auto;flex-direction:row;overflow-x:auto;margin:8px;padding:8px}nav .brand,.spacer,nav .foot{display:none}.nv{white-space:nowrap;padding:9px 12px}main{padding:4px 10px 20px}.chat{height:calc(100vh - 230px)}}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="login">
 <div class="glass lg">
  <div class="logo">🎓</div>
  <h1>Smart Campus</h1>
  <p>AI-powered student assistance &amp; campus management</p>
  <input id="em" placeholder="Student ID or email" value="om.prakash.sahoo@campus.edu">
  <input id="pw" type="password" placeholder="Password" value="demo1234">
  <button class="btn" style="width:100%" id="lgb">Sign in securely</button>
  <p style="margin:14px 0 0;font-size:12px;text-align:center">Demo mode · any credentials work</p>
 </div>
</div>

<div id="app">
 <nav class="glass">
  <div class="brand"><div class="logo">🎓</div>Smart Campus</div>
  <div id="navs"></div>
  <div class="spacer"></div>
  <div class="foot">
   <button class="nv" id="role">🛡️ Switch to Admin</button>
   <button class="nv" id="th">🌓 Toggle theme</button>
   <button class="nv" id="out">↩ Sign out</button>
  </div>
 </nav>
 <main id="main"></main>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- 3D background ---------- */
(function(){
 if(!window.THREE)return;
 const cv=document.getElementById("bg");
 const r=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
 const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,1,.1,200);
 cam.position.set(0,14,26);
 const g=new THREE.Group();sc.add(g);
 const cols=[0x7c7cff,0x22d3ee,0xa78bfa];
 for(let x=-5;x<=5;x++)for(let z=-5;z<=5;z++){
  if(Math.random()<.35)continue;
  const h=.6+Math.random()*(Math.abs(x)+Math.abs(z)<4?7:3);
  const geo=new THREE.BoxGeometry(1.4,h,1.4);
  const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0x1a2050,transparent:true,opacity:.35}));
  m.position.set(x*2.2,h/2,z*2.2);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:cols[(Math.random()*3)|0],transparent:true,opacity:.75}));
  m.add(e);m.userData.s=Math.random()*6;m.userData.h=h;g.add(m);
 }
 const pg=new THREE.BufferGeometry(),pts=[];
 for(let i=0;i<350;i++)pts.push((Math.random()-.5)*60,Math.random()*22,(Math.random()-.5)*60);
 pg.setAttribute("position",new THREE.Float32BufferAttribute(pts,3));
 const P=new THREE.Points(pg,new THREE.PointsMaterial({color:0x22d3ee,size:.14,transparent:true,opacity:.8}));
 sc.add(P);
 let mx=0,my=0;
 addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
 function rs(){r.setSize(innerWidth,innerHeight,false);r.setPixelRatio(Math.min(devicePixelRatio,2));cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
 addEventListener("resize",rs);rs();
 let t=0;
 (function loop(){
  t+=.01;g.rotation.y=t*.15;
  g.children.forEach(m=>{m.scale.y=1+Math.sin(t*2+m.userData.s)*.08});
  P.rotation.y=-t*.05;
  cam.position.x+=((mx*10)-cam.position.x)*.03;
  cam.position.y+=((14-my*6)-cam.position.y)*.03;
  cam.lookAt(0,2,0);
  r.render(sc,cam);requestAnimationFrame(loop);
 })();
})();

/* ---------- Simulated backend ---------- */
const $=(s,e=document)=>e.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const seed={
 subjects:[{c:"CS301",n:"Data Structures",a:27,t:31},{c:"CS305",n:"Operating Systems",a:22,t:30},{c:"MA210",n:"Discrete Maths",a:19,t:28},{c:"CS320",n:"Machine Learning",a:29,t:32},{c:"HS101",n:"Professional Ethics",a:14,t:18}],
 slots:{"9:00":0,"10:00":1,"11:00":0,"2:00":0,"3:00":0,"4:00":1},
 notices:[{t:"Mid-semester exams begin 18 Nov",by:"Exam Cell",d:"Today"},{t:"Hackathon registration closes Friday",by:"Tech Club",d:"Yesterday"},{t:"Library extends hours to 11 PM",by:"Library",d:"2 days ago"}],
 fees:12500,
 tasks:[{id:1,t:'ML Lab – Linear Regression',c:'CS320',d:'Wed, 4 Nov',x:0},{id:2,t:'OS Assignment 4',c:'CS305',d:'Fri, 6 Nov',x:0},{id:3,t:'Graph Theory Problem Set',c:'MA210',d:'Mon, 9 Nov',x:0},{id:4,t:'DS Lab Report',c:'CS301',d:'Wed, 28 Oct',x:1}],
 books:[{id:1,t:'Introduction to Algorithms',a:'Cormen et al.',i:0},{id:2,t:'Operating System Concepts',a:'Silberschatz',i:0},{id:3,t:'Deep Learning',a:'Goodfellow',i:0},{id:4,t:'Discrete Mathematics',a:'Kenneth Rosen',i:0},{id:5,t:'Clean Code',a:'Robert C. Martin',i:0},{id:6,t:'Computer Networks',a:'Andrew Tanenbaum',i:0}]
};
let db={...seed,...store.get("sc_db",{})};
const save=()=>store.set("sc_db",db);
const live={lib:68,canteen:14,bus:6,wifi:92};
const sched=[["09:00","Data Structures","Lab 3 · Prof. Rao"],["11:00","Machine Learning","Room 204 · Dr. Mehta"],["14:00","Operating Systems","Room 110 · Prof. Iyer"],["16:00","Discrete Maths","Room 305 · Dr. Das"]];
const pct=s=>Math.round(s.a/s.t*100);
const overall=()=>Math.round(db.subjects.reduce((x,s)=>x+s.a,0)/db.subjects.reduce((x,s)=>x+s.t,0)*100);
const api={
 async login(e){await sleep(1100);const n=(e.split("@")[0]||"om prakash sahoo").replace(/[._]/g," ").replace(/\b\w/g,c=>c.toUpperCase());return{name:n,id:"SC2024-0142",dept:"B.Tech CSE · Sem 5"}},
 async mark(c){await sleep(900);const s=db.subjects.find(x=>x.c===c);s.a++;s.t++;save();return s},
 async book(k){await sleep(600);db.slots[k]=db.slots[k]?0:1;save();return db.slots[k]},
 async post(n){await sleep(700);db.notices.unshift(n);save()},
 async toggle(id){await sleep(500);const t=db.tasks.find(x=>x.id===id);t.x=t.x?0:1;save();return t.x},
 async issue(id){await sleep(600);const b=db.books.find(x=>x.id===id);b.i=b.i?0:1;save();return b.i},
 async chat(q){
  await sleep(700+Math.random()*700);q=q.toLowerCase();
  const low=[...db.subjects].sort((a,b)=>pct(a)-pct(b))[0];
  if(/attend|percent|shortage/.test(q))return`Your overall attendance is ${overall()}%.\nLowest: ${low.n} at ${pct(low)}%.`+(pct(low)<75?` Attend the next ${Math.ceil((.75*low.t-low.a)/.25)} classes to get back above 75%.`:" You are safe in every subject. 🎉");
  if(/class|schedule|timetable|next|today/.test(q))return"Today’s timetable:\n"+sched.map(s=>`${s[0]} – ${s[1]} (${s[2]})`).join("\n");
  if(/bus|transport/.test(q))return`The campus shuttle is ${live.bus} min away from the Main Gate. Live location is on the Services page.`;
  if(/library|seat|study/.test(q))return`Library occupancy is ${live.lib}% right now. ${live.lib>80?"It’s busy – try booking a study room.":"Plenty of seats – a study room is also bookable under Services."}`;
  if(/fee|due|payment/.test(q))return`Pending fee: ₹${db.fees.toLocaleString("en-IN")}, due 30 Nov. Pay on the finance portal to avoid late charges.`;
  if(/exam|test|date/.test(q))return"Upcoming exams:\n18 Nov – Operating Systems\n21 Nov – Machine Learning\n25 Nov – Data Structures";
  if(/canteen|food|lunch|menu/.test(q))return`The canteen queue is about ${live.canteen} min. Today’s special: paneer wrap and cold coffee ☕`;
  if(/assign|homework|deadline|task/.test(q)){const p=db.tasks.filter(t=>!t.x);return p.length?'Pending assignments:\n'+p.map(t=>`${t.t} – due ${t.d}`).join('\n'):'No pending assignments 🎉'}
  if(/hi|hello|hey|help/.test(q))return"Hi! I can help with attendance, timetable, exams, fees, library, canteen and bus timings. What do you need?";
  return"I couldn’t match that exactly, but I can help with attendance, timetable, exams, fees, library, canteen and bus timings. Try one of the suggestions below.";
 }
};

/* ---------- UI helpers ---------- */
let user=null,admin=false,page="dash",timers=[];
function toast(m){const t=document.createElement("div");t.className="t";t.textContent=m;$("#toast").appendChild(t);setTimeout(()=>t.remove(),3200)}
function countUp(el){const to=+el.dataset.to,dec=+(el.dataset.d||0),suf=el.dataset.s||"";let s=null;
 (function f(ts){s=s||ts;const p=Math.min((ts-s)/1100,1);el.textContent=(to*(1-Math.pow(1-p,3))).toFixed(dec)+suf;if(p<1)requestAnimationFrame(f)})(performance.now())}
const navs=[["dash","🏠","Dashboard"],["ai","🤖","AI Assistant"],["att","📅","Attendance"],["svc","🚌","Campus Services"],["task","✅","Assignments"],["lib","📖","Library"],["res","🎯","Results"],["not","📢","Notices"],["adm","👥","Students"]];
function drawNav(){$("#navs").innerHTML=navs.filter(n=>n[0]!=="adm"||admin).map(n=>`<button class="nv ${n[0]===page?"act":""}" data-p="${n[0]}">${n[1]} ${n[2]}</button>`).join("")}
function go(p){page=p;timers.forEach(clearInterval);timers=[];drawNav();const m=$("#main");m.innerHTML=pages[p]();m.scrollTop=0;(init[p]||(()=>{}))();document.querySelectorAll("[data-to]").forEach(countUp)}
const head=(t,s)=>`<div class="top"><div><h2>${t}</h2><small>${s}</small></div><span class="chip"><span class="dot"></span>${admin?"Admin":"Student"} · ${user.name}</span></div>`;

/* ---------- Pages ---------- */
const pages={
 dash(){const nx=sched[1];return head(`Welcome back, ${user.name.split(" ")[0]} 👋`,user.dept+" · "+user.id)+`
 <div class="grid g4">
  <div class="card glass stat"><div class="l">Attendance</div><div class="v" data-to="${overall()}" data-s="%">0</div><div class="bar"><i style="width:${overall()}%"></i></div></div>
  <div class="card glass stat"><div class="l">Current CGPA</div><div class="v" data-to="8.7" data-d="1">0</div><div class="l">Top 12% of class</div></div>
  <div class="card glass stat"><div class="l">Assignments due</div><div class="v" data-to="${db.tasks.filter(t=>!t.x).length}">0</div><div class="l">Next: ${(db.tasks.find(t=>!t.x)||{t:'All clear 🎉'}).t}</div></div>
  <div class="card glass stat"><div class="l">Fees pending</div><div class="v">₹${db.fees.toLocaleString("en-IN")}</div><div class="l">Due 30 Nov</div></div>
 </div>
 <div class="grid g2">
  <div class="card glass"><h3>📡 Live campus status</h3>
   <div class="row"><span>Library occupancy</span><b id="lv-lib"></b></div>
   <div class="row"><span>Canteen queue</span><b id="lv-can"></b></div>
   <div class="row"><span>Shuttle ETA</span><b id="lv-bus"></b></div>
   <div class="row"><span>Wi-Fi health</span><b id="lv-wifi"></b></div></div>
  <div class="card glass"><h3>📊 Subject attendance</h3>${db.subjects.map(s=>`<div style="margin-bottom:10px"><div class="row" style="border:0;padding:0 0 4px"><small>${s.n}</small><b class="${pct(s)<75?"bad":"ok"}">${pct(s)}%</b></div><div class="bar"><i style="width:${pct(s)}%"></i></div></div>`).join("")}</div>
  <div class="card glass"><h3>🗓️ Today’s schedule</h3>${sched.map(s=>`<div class="row"><div><b>${s[1]}</b><br><small>${s[2]}</small></div><span class="tag">${s[0]}</span></div>`).join("")}</div>
  <div class="card glass"><h3>✨ AI insight</h3><p style="margin:0 0 12px">Your next class is <b>${nx[1]}</b> at ${nx[0]}. Based on your attendance trend, you should prioritise <b>${[...db.subjects].sort((a,b)=>pct(a)-pct(b))[0].n}</b> this week.</p><button class="btn" data-p="ai">Ask the assistant</button></div>
 </div>`},
 ai(){return head("AI Assistant","Ask about anything on campus")+`<div class="glass chat"><div id="msgs"></div>
  <div class="sug">${["What’s my attendance?","Today’s timetable","Is the library crowded?","Next bus?","Exam dates","Pending fees"].map(s=>`<button data-q="${s}">${s}</button>`).join("")}</div>
  <div class="cin"><input id="q" placeholder="Type your question…"><button class="btn" id="send">Send</button></div></div>`},
 att(){return head("Attendance","Real-time tracking with 75% shortage predictor")+`<div class="card glass wrap"><table><tr><th>Course</th><th>Attended</th><th>%</th><th>Status</th><th>Predictor</th><th></th></tr>
  ${db.subjects.map(s=>{const p=pct(s);const need=Math.ceil((.75*s.t-s.a)/.25),skip=Math.floor(s.a/.75-s.t);return`<tr><td><b>${s.n}</b><br><small>${s.c}</small></td><td>${s.a}/${s.t}</td><td>${p}%</td><td class="${p<75?"bad":"ok"}">${p<75?"Shortage":"Safe"}</td><td><small>${p<75?`Attend next ${need}`:`Can skip ${skip}`}</small></td><td><button class="btn ghost" data-m="${s.c}">📷 QR check-in</button></td></tr>`}).join("")}</table></div>`},
 svc(){return head("Campus Services","Book spaces, track the shuttle, skip the queue")+`<div class="grid g2" style="margin-top:0">
  <div class="card glass"><h3>🚌 Live shuttle tracker</h3><svg viewBox="0 0 400 200" style="width:100%"><path id="route" d="M30 150 C100 20 180 190 250 90 S350 40 372 120" fill="none" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/><circle cx="30" cy="150" r="7" fill="var(--a)"/><circle cx="372" cy="120" r="7" fill="var(--b)"/><text x="22" y="175" font-size="11" fill="var(--muted)">Main Gate</text><text x="330" y="145" font-size="11" fill="var(--muted)">Hostel</text><circle id="bus" r="9" fill="var(--ok)"><animate attributeName="r" values="9;13;9" dur="1.4s" repeatCount="indefinite"/></circle></svg><div class="row"><span>ETA to Main Gate</span><b id="eta"></b></div></div>
  <div class="card glass"><h3>📚 Study room booking</h3><div class="slots">${Object.entries(db.slots).map(([k,v])=>`<button class="slot ${v?"bk":""}" data-s="${k}">${k}${+k.split(":")[0]<8?" PM":" AM"}<br><small>${v?"Booked":"Available"}</small></button>`).join("")}</div></div>
  <div class="card glass"><h3>🍽️ Canteen pre-order</h3>${[["Paneer wrap",80],["Veg biryani",110],["Cold coffee",60],["Masala dosa",70]].map(i=>`<div class="row"><span>${i[0]} <small>₹${i[1]}</small></span><button class="btn ghost" data-o="${i[0]}">Order</button></div>`).join("")}</div>
 </div>`},
 task(){const d=db.tasks.filter(t=>t.x).length,n=db.tasks.length;return head('Assignments','Track deadlines and submissions')+`<div class='card glass' style='margin-bottom:14px'><div class='row' style='border:0'><b>${d} of ${n} submitted</b><span>${Math.round(d/n*100)}%</span></div><div class='bar'><i style='width:${d/n*100}%'></i></div></div><div class='card glass'>${db.tasks.map(t=>`<div class='row'><div><b style='${t.x?'text-decoration:line-through;opacity:.6':''}'>${t.t}</b><br><small>${t.c} · Due ${t.d}</small></div><button class='btn ${t.x?'ghost':''}' data-t='${t.id}'>${t.x?'Submitted ✔':'Submit'}</button></div>`).join('')}</div>`},
 lib(){return head('Library','Search the catalogue and issue books')+`<div class='card glass'><input id='bs' placeholder='Search by title or author…' style='margin-bottom:10px'><div id='bl'></div></div>`},
 res(){const g=[8.3,8.6,8.8,9.0];return head('Results','Semester performance · CGPA 8.7')+`<div class='grid g2' style='margin-top:0'><div class='card glass'><h3>📈 SGPA trend</h3><div style='display:flex;align-items:flex-end;gap:14px;height:190px'>${g.map((v,i)=>`<div style='flex:1;text-align:center'><b>${v}</b><div style='height:${(v-6)*50}px;border-radius:10px 10px 0 0;background:linear-gradient(180deg,var(--b),var(--a));animation:grow 1s ${i*.15}s both'></div><small>Sem ${i+1}</small></div>`).join('')}</div></div><div class='card glass'><h3>🏅 Last semester grades</h3>${[['Algorithms','A+'],['Database Systems','A'],['Computer Networks','A+'],['Linear Algebra','B+']].map(r=>`<div class='row'><span>${r[0]}</span><span class='tag'>${r[1]}</span></div>`).join('')}</div></div>`},
 adm(){return head('Student Management','Admin console · 1,248 students')+`<div class='grid g4' style='margin-bottom:14px'><div class='card glass stat'><div class='l'>Enrolled</div><div class='v' data-to='1248'>0</div></div><div class='card glass stat'><div class='l'>Avg attendance</div><div class='v' data-to='81' data-s='%'>0</div></div><div class='card glass stat'><div class='l'>At risk (&lt;75%)</div><div class='v' data-to='96'>0</div></div></div><div class='card glass wrap'><input id='ss' placeholder='Search students…' style='margin-bottom:10px'><table><tr><th>ID</th><th>Name</th><th>Dept</th><th>Attendance</th><th>CGPA</th></tr><tbody id='sb'></tbody></table></div>`},
 not(){return head("Notices","Campus announcements")+(admin?`<div class="card glass" style="margin-bottom:14px"><h3>📝 Post a notice (admin)</h3><div class="cin" style="padding:0"><input id="nt" placeholder="Notice title"><button class="btn" id="np">Publish</button></div></div>`:"")+`<div class="card glass" id="nl">${db.notices.map(n=>`<div class="row"><div><b>${n.t}</b><br><small>${n.by}</small></div><span class="tag">${n.d}</span></div>`).join("")}</div>`}
};
const init={
 dash(){const f=()=>{
   $("#lv-lib").innerHTML=live.lib+"%";$("#lv-can").innerHTML=live.canteen+" min";$("#lv-bus").innerHTML=live.bus+" min";$("#lv-wifi").innerHTML=`<span class="ok">${live.wifi}%</span>`};f();timers.push(setInterval(f,1000))},
 ai(){const add=(c,t)=>{const d=document.createElement("div");d.className="m "+c;d.innerHTML=t;$("#msgs").appendChild(d);$("#msgs").scrollTop=1e9;return d};
   add("a",`Hi ${user.name.split(" ")[0]}! I’m your campus AI. Ask me about attendance, classes, exams, fees, the library or the bus.`);
   const ask=async q=>{if(!q.trim())return;add("u",q.replace(/</g,"&lt;"));$("#q").value="";const t=add("a",'<span class="typing"><span></span><span></span><span></span></span>');const r=await api.chat(q);t.textContent=r};
   window._ask=ask;$("#send").onclick=()=>ask($("#q").value);$("#q").onkeydown=e=>{if(e.key==="Enter")ask($("#q").value)}},
 lib(){const r=()=>{const q=$('#bs').value.toLowerCase();$('#bl').innerHTML=db.books.filter(b=>(b.t+b.a).toLowerCase().includes(q)).map(b=>`<div class='row'><div><b>${b.t}</b><br><small>${b.a}</small></div><button class='btn ${b.i?'ghost':''}' data-b='${b.id}'>${b.i?'Return':'Issue'}</button></div>`).join('')||'<small>No books found</small>'};$('#bs').oninput=r;r();window._rl=r},
 adm(){const S=[['SC2024-0142',user.name,'CSE',overall(),8.7],['SC2024-0143','Priya Nair','ECE',91,9.1],['SC2024-0150','Rahul Verma','ME',68,7.2],['SC2024-0158','Sneha Patel','CSE',84,8.4],['SC2024-0161','Kabir Singh','EEE',72,7.8],['SC2024-0170','Ananya Das','IT',95,9.4]];const r=()=>{const q=$('#ss').value.toLowerCase();$('#sb').innerHTML=S.filter(s=>s.join(' ').toLowerCase().includes(q)).map(s=>`<tr><td>${s[0]}</td><td><b>${s[1]}</b></td><td>${s[2]}</td><td class='${s[3]<75?'bad':'ok'}'>${s[3]}%</td><td>${s[4]}</td></tr>`).join('')};$('#ss').oninput=r;r()},
 svc(){const p=$("#route"),b=$("#bus");let t=0;const L=p.getTotalLength();const mv=()=>{t=(t+.0025)%1;const pt=p.getPointAtLength(t*L);b.setAttribute("cx",pt.x);b.setAttribute("cy",pt.y);$("#eta").textContent=Math.max(1,Math.round((1-t)*12))+" min"};mv();timers.push(setInterval(mv,50))}
};

/* ---------- Events ---------- */
document.addEventListener("click",async e=>{
 const el=e.target.closest("[data-p],[data-q],[data-m],[data-s],[data-o],[data-t],[data-b]");if(!el)return;
 if(el.dataset.p)return go(el.dataset.p);
 if(el.dataset.q&&window._ask)return _ask(el.dataset.q);
 if(el.dataset.m){el.textContent="Verifying…";const s=await api.mark(el.dataset.m);toast(`✅ Attendance marked for ${s.n}`);return go("att")}
 if(el.dataset.s){const v=await api.book(el.dataset.s);toast(v?"Study room booked ✔":"Booking cancelled");return go("svc")}
 if(el.dataset.t){const x=await api.toggle(+el.dataset.t);toast(x?'Assignment submitted ✔':'Submission withdrawn');return go('task')}
 if(el.dataset.b){const x=await api.issue(+el.dataset.b);toast(x?'Book issued · due in 14 days':'Book returned');return window._rl()}
 if(el.dataset.o){el.textContent="Placing…";await sleep(800);toast(`🧾 ${el.dataset.o} ordered · Token #${100+Math.floor(Math.random()*900)}`);el.textContent="Order"}
});
document.addEventListener("click",async e=>{
 if(e.target.id==="np"){const v=$("#nt").value.trim();if(!v)return toast("Enter a title");await api.post({t:v,by:"Administration",d:"Just now"});toast("Notice published");go("not")}
});
$("#lgb").onclick=async()=>{const b=$("#lgb");b.textContent="Authenticating…";user=await api.login($("#em").value);
 $("#login").style.display="none";$("#app").classList.add("on");toast("Signed in as "+user.name);go("dash")};
$("#out").onclick=()=>{timers.forEach(clearInterval);$("#app").classList.remove("on");$("#login").style.display="grid";$("#lgb").textContent="Sign in securely"};
$("#role").onclick=()=>{admin=!admin;$("#role").textContent=admin?"🎓 Switch to Student":"🛡️ Switch to Admin";toast("Role: "+(admin?"Admin":"Student"));go(admin||page!=="adm"?page:"dash")};
$("#th").onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dark?"light":"dark"};
setInterval(()=>{const w=(v,a,lo,hi)=>Math.min(hi,Math.max(lo,v+Math.round((Math.random()-.5)*a)));live.lib=w(live.lib,6,30,98);live.canteen=w(live.canteen,3,2,30);live.bus=w(live.bus,2,1,12);live.wifi=w(live.wifi,3,80,99)},1000);
const alerts=['📢 Hackathon registration closes in 2 days','🚌 Shuttle delayed by 3 minutes','📚 Library has 12 free seats','🍽️ Canteen special: masala dosa is ready'];
setInterval(()=>{if($('#app').classList.contains('on'))toast(alerts[Math.floor(Math.random()*alerts.length)])},20000);
</script>
</body>
</html>
